# Local development database.
#   Start:  docker compose up -d
#   Stop:   docker compose down        (add -v to also delete all data)
services:
  postgres:
    image: postgres:17-alpine
    container_name: thelife-postgres
    environment:
      POSTGRES_DB: thelife
      POSTGRES_USER: thelife
      POSTGRES_PASSWORD: thelife
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thelife -d thelife"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
